version: 2
updates:
  # Backend (Gradle)
  - package-ecosystem: "gradle"
    directory: "/backend/autotrader-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    ignore:
      # H2 2.4.x requires Hibernate 6.5+ (Spring Boot 3.3+)
      - dependency-name: "com.h2database:h2"
        versions: [">=2.3.0"]
      # Flyway 10+ requires Spring Boot 3.3+
      - dependency-name: "org.flywaydb:flyway-core"
        versions: [">=10.0.0"]

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # Next.js 16 requires significant migration (async APIs, middleware rename)
      - dependency-name: "@next/bundle-analyzer"
        versions: [">=16.0.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

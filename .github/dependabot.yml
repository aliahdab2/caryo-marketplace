version: 2
updates:
  # Backend (Gradle)
  - package-ecosystem: "gradle"
    directory: "/backend/autotrader-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    ignore:
      # H2 2.4.x requires Hibernate 6.5+ (Spring Boot 3.3+)
      - dependency-name: "com.h2database:h2"
        versions: [">=2.3.0"]
      # Flyway 10+ requires Spring Boot 3.3+
      - dependency-name: "org.flywaydb:flyway-core"
        versions: [">=10.0.0"]

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # React 19 requires Next.js 15.1+ and major migration
      - dependency-name: "react"
        versions: [">=19.0.0"]
      - dependency-name: "react-dom"
        versions: [">=19.0.0"]
      - dependency-name: "@types/react"
        versions: [">=19.0.0"]
      - dependency-name: "@types/react-dom"
        versions: [">=19.0.0"]
      # Next.js 16 not yet stable, requires React 19
      - dependency-name: "@next/bundle-analyzer"
        versions: [">=16.0.0"]
      # react-i18next 16.x requires i18next 25+ migration
      - dependency-name: "react-i18next"
        versions: [">=16.0.0"]
      # testing-library/react 16 requires React 19
      - dependency-name: "@testing-library/react"
        versions: [">=16.0.0"]
      # openai 6.x has breaking API changes
      - dependency-name: "openai"
        versions: [">=6.0.0"]
      # next-seo 7.x has breaking API changes
      - dependency-name: "next-seo"
        versions: [">=7.0.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

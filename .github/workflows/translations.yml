name: Translation Quality Checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/locales/**'
      - 'frontend/package.json'
  workflow_dispatch: {}

jobs:
  translations-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Compute changed locale files
        id: diff
        shell: bash
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            git fetch origin main --depth=1
            BASE_SHA=$(git rev-parse origin/main)
          else
            git fetch origin "$BASE_SHA" --depth=1 || true
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA"..."${{ github.sha }}" | grep '^frontend/public/locales/' || true)
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      
      - name: i18n structural rules (flat keys, numerals, dotted-keys)
        working-directory: ./frontend
        env:
          FAIL_DOT_KEYS: 'true'
          ONLY_CHANGED_FILES: 'true'
          CHANGED_FILES: ${{ steps.diff.outputs.changed }}
          CI: 'true'
        run: |
          npm run test:i18n -- --reporters=summary

      - name: Missing-keys check (code usages vs locales)
        working-directory: ./frontend
        env:
          CI: 'true'
        run: |
          npm run test -- --runTestsByPath src/__tests__/i18n/missingKeys.test.ts --reporters=summary



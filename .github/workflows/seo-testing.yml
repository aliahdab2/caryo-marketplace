name: SEO Testing

concurrency:
  group: seo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/src/**'
      - 'frontend/package*.json'
      - '.github/workflows/seo-testing.yml'
    types: [opened, synchronize, reopened]

  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/src/**'
      - 'frontend/package*.json'
      - '.github/workflows/seo-testing.yml'

  workflow_dispatch:

jobs:
  seo-tests:
    name: SEO Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci --prefer-offline --no-audit --silent
      env:
        HUSKY: 0

    - name: Run SEO structured data tests
      working-directory: ./frontend
      run: |
        npm test -- --testPathPattern=seo \
          --coverage \
          --collectCoverageFrom='src/utils/structuredData.ts' \
          --coverageReporters=json-summary --coverageReporters=text \
          --watchAll=false

    - name: Verify SEO utilities exist
      working-directory: ./frontend
      run: |
        echo "Checking SEO utility functions..."
        grep -q "generateVehicleSchema" src/utils/structuredData.ts || { echo "generateVehicleSchema missing"; exit 1; }
        grep -q "generateOrganizationSchema" src/utils/structuredData.ts || { echo "generateOrganizationSchema missing"; exit 1; }
        grep -q "generateBreadcrumbSchema" src/utils/structuredData.ts || { echo "generateBreadcrumbSchema missing"; exit 1; }
        echo "All SEO utilities present"

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: seo-coverage
        path: frontend/coverage/
        retention-days: 14

    - name: Comment PR with results
      uses: actions/github-script@v8
      if: github.event_name == 'pull_request'
      continue-on-error: true
      with:
        script: |
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '## SEO Tests\n\nAll SEO structured data tests passed. See workflow artifacts for coverage details.'
          });

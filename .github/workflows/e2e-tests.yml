# E2E Tests with Playwright
name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  E2E_BASE_URL: http://localhost:3000
  E2E_API_URL: http://localhost:8080

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: caryo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build backend
        working-directory: backend/autotrader-backend
        run: ./gradlew build -x test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/caryo_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Start backend
        working-directory: backend/autotrader-backend
        run: |
          ./gradlew bootRun &
          sleep 30
          curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:8080/actuator/health
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/caryo_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_PROFILES_ACTIVE: test
          TEST_DB_DRIVER: org.postgresql.Driver

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXTAUTH_SECRET: e2e-test-secret-key-for-ci
          NEXTAUTH_URL: http://localhost:3000

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run start &
          sleep 10
          curl --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXTAUTH_SECRET: e2e-test-secret-key-for-ci
          NEXTAUTH_URL: http://localhost:3000

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: frontend/e2e/test-results/
          retention-days: 7

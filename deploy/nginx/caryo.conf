# Caryo Marketplace — nginx reverse proxy (production)
# Mounted by docker-compose.prod.yml into the caryo-nginx container.
#
# Routing:
#   /               -> Next.js frontend (includes next-auth at /api/auth/*)
#   /api/v1/        -> Spring Boot backend (ALL backend routes live here)
#   /actuator/health-> backend health (only this actuator path is public)
#   /storage/       -> MinIO (media files)
#   /img/           -> imgproxy (resized/optimized images)
#
# TLS: enable the 443 server block once certificates exist in deploy/nginx/ssl
# (or terminate TLS at Cloudflare and keep port 80 only behind it).

upstream frontend_upstream {
    server frontend:3100;
    keepalive 16;
}

upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

upstream minio_upstream {
    server minio:9000;
    keepalive 16;
}

upstream imgproxy_upstream {
    server imgproxy:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Uploads: multipart cap is 110MB on the backend
    client_max_body_size 110m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Used by the container healthcheck
    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    # Backend owns /api/v1/ only — /api/auth/* (next-auth) must reach the frontend
    location /api/v1/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /actuator/health {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # MinIO media (public bucket reads); /storage/<bucket>/<key> -> minio /<bucket>/<key>
    location /storage/ {
        proxy_pass http://minio_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # imgproxy; /img/... -> imgproxy /...
    location /img/ {
        proxy_pass http://imgproxy_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Resized images are immutable per URL — let browsers/CDN cache them
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# Shared location blocks, included by the serving server block in both the
# plain-HTTP and TLS variants. Keep this the single source of routing truth.
#
#   /               -> Next.js frontend (includes next-auth at /api/auth/*)
#   /api/v1/        -> Spring Boot backend (ALL backend routes live here)
#   /actuator/health-> backend health (only this actuator path is public)
#   /storage/       -> MinIO (media files)
#   /img/           -> imgproxy (resized/optimized images)

# Backend owns /api/v1/ only — /api/auth/* (next-auth) must reach the frontend
location /api/v1/ {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    add_header Strict-Transport-Security $hsts_header always;
}

location = /actuator/health {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
}

# MinIO media (public bucket reads); /storage/<bucket>/<key> -> minio /<bucket>/<key>
location /storage/ {
    proxy_pass http://minio_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    add_header Strict-Transport-Security $hsts_header always;
}

# imgproxy; /img/... -> imgproxy /...
location /img/ {
    proxy_pass http://imgproxy_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Resized images are immutable per URL — let browsers/CDN cache them
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security $hsts_header always;
}

location / {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security $hsts_header always;
}

# Plain-HTTP variant — selected by 10-caryo-tls.sh when no certificate is
# present in deploy/nginx/ssl/. Intended for local prod-parity runs and for
# the first boot on a new server (before certbot has issued anything), or when
# TLS is terminated upstream by Cloudflare.
#
# Do NOT expose this variant directly to the internet: JWTs and passwords
# would travel in plaintext. Run scripts/deploy/issue-cert.sh to get a
# certificate; nginx then switches to the TLS variant on next restart.

include /etc/nginx/caryo/shared-http.conf;

server {
    listen 80;
    server_name _;

    # Uploads: multipart cap is 110MB on the backend
    client_max_body_size 110m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Used by the container healthcheck
    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    # ACME http-01 challenges, so a certificate can be issued without
    # first taking the site down.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    include /etc/nginx/caryo/locations.conf;
}

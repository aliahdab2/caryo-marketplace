# Shared http-context config: upstreams + helpers.
# Included first by whichever server variant 10-caryo-tls.sh selects.

server_tokens off;

# HSTS is only meaningful over TLS. nginx omits an add_header whose value is
# an empty string, so the same directive is a no-op on the plain-HTTP variant.
map $scheme $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

upstream frontend_upstream {
    server frontend:3100;
    keepalive 16;
}

upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

upstream minio_upstream {
    server minio:9000;
    keepalive 16;
}

upstream imgproxy_upstream {
    server imgproxy:8080;
    keepalive 16;
}

# ============================================================================
# Caryo Marketplace — full production stack
#
# Deployed by scripts/deploy/deploy.sh (same script for manual SSH deploys
# and GitHub Actions). Configuration comes from env/production.env — copy
# env/production.env.example and fill it in.
#
#   docker compose -f docker-compose.prod.yml --env-file env/production.env up -d
# ============================================================================

name: caryo

services:
  db:
    image: postgres:16-alpine
    container_name: caryo-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    networks: [caryo-network]

  # Backend caches reference data and listing search here. Without this
  # service, application-prod.properties (spring.cache.type=redis) would
  # point at localhost inside the backend container and every cache would
  # silently no-op.
  redis:
    image: redis:7-alpine
    container_name: caryo-redis
    restart: always
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    networks: [caryo-network]

  # Scheduled logical backups. deploy.sh also takes a pre-deploy snapshot;
  # this covers the days nobody deploys.
  db-backup:
    image: postgres:16-alpine
    container_name: caryo-db-backup
    restart: always
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "caryo: scheduled backups every ${BACKUP_INTERVAL_SECONDS:-86400}s, keeping ${BACKUP_KEEP:-14}"
        while true; do
          TS=$$(date +%Y%m%d-%H%M%S)
          OUT="/backups/scheduled-$$TS.sql.gz"
          if pg_dump | gzip > "$$OUT"; then
            echo "caryo: backup written $$OUT ($$(du -h "$$OUT" | cut -f1))"
            ls -t /backups/scheduled-*.sql.gz | tail -n +$$((${BACKUP_KEEP:-14} + 1)) | xargs -r rm -f
          else
            echo "caryo: ERROR backup failed" >&2
            rm -f "$$OUT"
          fi
          sleep "${BACKUP_INTERVAL_SECONDS:-86400}"
        done
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    networks: [caryo-network]

  minio:
    image: minio/minio:latest
    container_name: caryo-minio
    restart: always
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    networks: [caryo-network]

  imgproxy:
    image: darthsim/imgproxy:latest
    container_name: caryo-imgproxy
    restart: always
    environment:
      # Frontend currently builds /insecure/ URLs, so unsafe URLs stay enabled
      # even when keys are set. Follow-up: switch to signed URLs.
      IMGPROXY_ALLOW_UNSAFE_URL: "true"
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_REGION: us-east-1
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      IMGPROXY_QUALITY: 80
      IMGPROXY_AVIF_QUALITY: 75
      IMGPROXY_WEBP_QUALITY: 80
      IMGPROXY_CONCURRENCY: 10
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      IMGPROXY_MAX_SRC_FILE_SIZE: 20971520
      IMGPROXY_SET_CANONICAL_HEADER: "true"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    networks: [caryo-network]

  backend:
    build:
      context: ./backend/caryo-backend
      dockerfile: Dockerfile
    container_name: caryo-backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Only used to machine-translate car reference data (brands/models) into
      # Arabic during seeding. Optional: without it that one feature no-ops.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - STORAGE_S3_ENABLED=true
      - STORAGE_S3_ENDPOINT=http://minio:9000
      - STORAGE_S3_BUCKET_NAME=${S3_BUCKET_NAME:-caryo-assets}
      - STORAGE_S3_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - STORAGE_S3_SECRET_KEY=${MINIO_SECRET_KEY}
      - STORAGE_S3_REGION=us-east-1
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${S3_BUCKET_NAME:-caryo-assets}
      - IMGPROXY_URL=${PUBLIC_URL}/img
      - IMGPROXY_KEY=${IMGPROXY_KEY:-}
      - IMGPROXY_SALT=${IMGPROXY_SALT:-}
      - CORS_ALLOWED_ORIGINS=${PUBLIC_URL}
      # Every outbound link in email (verification, password reset, newsletter
      # confirm/unsubscribe) is built from this one value.
      - WEBSITE_URL=${PUBLIC_URL}
      - EMAIL_USERNAME=${EMAIL_USERNAME:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@caryo.sy}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=production
      - SEARCH_FTS_ENABLED=true
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    networks: [caryo-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_MINIO_URL: ${PUBLIC_URL}/storage
        NEXT_PUBLIC_IMGPROXY_URL: ${PUBLIC_URL}/img
        NEXT_PUBLIC_BASE_URL: ${PUBLIC_URL}
        NEXTAUTH_URL: ${PUBLIC_URL}
        SITE_URL: ${PUBLIC_URL}
    container_name: caryo-frontend
    restart: always
    environment:
      - NEXTAUTH_URL=${PUBLIC_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - NEXT_PUBLIC_API_URL=${PUBLIC_URL}
      - NEXT_PUBLIC_MINIO_URL=${PUBLIC_URL}/storage
      - NEXT_PUBLIC_IMGPROXY_URL=${PUBLIC_URL}/img
      - NEXT_PUBLIC_BASE_URL=${PUBLIC_URL}
      - SITE_URL=${PUBLIC_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    networks: [caryo-network]

  nginx:
    image: nginx:alpine
    container_name: caryo-nginx
    restart: always
    # Only ports published on the host; override when co-hosting with
    # another stack (e.g. jawab24): HTTP_PORT=8090 HTTPS_PORT=8443
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # Used by the TLS server block; ignored on the plain-HTTP variant
      - SERVER_NAME=${CERT_DOMAIN:-_}
    volumes:
      # Server variant (TLS vs plain HTTP) is chosen at start by the
      # entrypoint hook, based on whether a certificate exists.
      - ./deploy/nginx/conf:/etc/nginx/caryo:ro
      - ./deploy/nginx/entrypoint.d/10-caryo-tls.sh:/docker-entrypoint.d/10-caryo-tls.sh:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    networks: [caryo-network]

volumes:
  postgres_prod_data:
  minio_prod_data:
  backend_uploads:
  # ACME http-01 challenge webroot, shared with the one-off certbot container
  # started by scripts/deploy/issue-cert.sh
  certbot_webroot:
  # certbot's own state (account key, renewal config, issued certs)
  certbot_conf:

networks:
  caryo-network:
    driver: bridge

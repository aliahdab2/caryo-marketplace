# Production overrides for docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-autotrader}
      POSTGRES_USER: ${DB_USER:-autotrader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autotrader}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autotrader}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    restart: always
    volumes:
      - minio_prod_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"  # MinIO API port
      - "9001:9001"  # MinIO Console port
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME:-autotrader}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-autotrader}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-autotrader}
      - STORAGE_S3_ENABLED=true
      - STORAGE_S3_ENDPOINT=http://minio:9000
      - STORAGE_S3_BUCKET_NAME=${S3_BUCKET_NAME:-autotrader-assets}
      - STORAGE_S3_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - STORAGE_S3_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - STORAGE_S3_REGION=${S3_REGION:-us-east-1}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - AUTOTRADER_APP_JWTSECRET=${JWT_SECRET:-defaultsecretkey123456789012345678901234567890}
      - JAVA_OPTS=${JAVA_OPTS:--Xms512m -Xmx1g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs}
    ports:
      - "${SERVER_PORT:-8080}:8080"  # Backend API port
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_prod_data:
    driver: local
  minio_prod_data:
    driver: local

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount initialization scripts for development database
      - ./config/dev/db-init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: autotrader
      POSTGRES_USER: autotrader
      POSTGRES_PASSWORD: autotrader
      # Set app.env for sample data scripts
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotrader"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"  # Expose PostgreSQL port for local development tools
    networks:
      - backend-network

  minio:
    image: minio/minio:latest
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "9000:9000"  # MinIO API port
      - "9001:9001"  # MinIO Console port
    networks:
      - backend-network

  # Development-specific MinIO setup script
  createbuckets:
    image: minio/mc
    container_name: ${COMPOSE_PROJECT_NAME}_dev-createbuckets-1 
    depends_on:
      - minio
    networks:
      - backend-network
    volumes:
      - ./config/dev/sample-images:/sample-images
    entrypoint: /bin/sh -c "
      echo '>>> Waiting for MinIO to be ready...' &&
      sleep 10 &&
      echo '>>> Setting up MinIO alias (myminio -> http://minio:9000)...' &&
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      echo '>>> Creating bucket myminio/caryo-assets if not exists...' &&
      mc mb --ignore-existing myminio/caryo-assets &&
      echo '>>> Setting bucket policy to public for myminio/caryo-assets...' &&
      mc policy set public myminio/caryo-assets &&
      echo '>>> Listing source /sample-images/ directory contents:' &&
      ls -R /sample-images/ &&
      echo '>>> Attempting to copy files from /sample-images/listings/ to myminio/caryo-assets/listings/ ...' &&
      mc cp --recursive /sample-images/listings/ myminio/caryo-assets/listings/ &&
      echo '>>> Listing MinIO bucket myminio/caryo-assets/ contents after copy:' &&
      mc ls --recursive myminio/caryo-assets/ &&
      echo '>>> Createbuckets script finished successfully.' || (echo '>>> Createbuckets script FAILED.' && exit 1)"
    restart: "no"

  # In development mode, we use the Gradle bootRun task with the development Dockerfile
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev  # Development-specific Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/autotrader
      - SPRING_DATASOURCE_USERNAME=autotrader
      - SPRING_DATASOURCE_PASSWORD=autotrader
      - STORAGE_S3_ENABLED=true
      - STORAGE_S3_ENDPOINT=http://minio:9000
      - STORAGE_S3_BUCKET_NAME=caryo-assets
      - STORAGE_S3_ACCESS_KEY=minioadmin
      - STORAGE_S3_SECRET_KEY=minioadmin
      - STORAGE_S3_REGION=us-east-1
      - SERVER_PORT=8080
      # Development-specific settings
      - LOGGING_LEVEL_COM_AUTOTRADER=DEBUG # Enhanced logging
      - SPRING_JPA_SHOW_SQL=true  # Show SQL queries
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=true  # Format SQL for readability
      # Email Configuration - uses MailDev by default for local development
      # To use Gmail SMTP, set these in a .env file (never commit real credentials):
      #   GMAIL_USERNAME=your-email@gmail.com
      #   GMAIL_APP_PASSWORD=your-app-password
      - SPRING_MAIL_HOST=${GMAIL_USERNAME:+smtp.gmail.com}
      - SPRING_MAIL_PORT=${GMAIL_USERNAME:+587}
      - SPRING_MAIL_USERNAME=${GMAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - APP_EMAIL_FROM=${GMAIL_USERNAME:-noreply@caryo.local}
      - APP_EMAIL_SUPPORT=${GMAIL_USERNAME:-support@caryo.local}
    volumes:
      - ./:/app  # Mount the entire project for hot reloading
      - ~/.gradle:/home/gradle/.gradle  # Mount Gradle cache
    ports:
      - "8080:8080"  # API port
      - "5005:5005"  # Remote debugging port
    restart: unless-stopped
    networks:
      - backend-network

  # Imgproxy - Industry standard image processing service
  # Access at: http://localhost:8081
  imgproxy:
    image: darthsim/imgproxy:latest
    environment:
      # For dev, we use insecure mode (no signature required)
      IMGPROXY_KEY: ""
      IMGPROXY_SALT: ""
      # S3/MinIO configuration
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      # Enable modern format detection (WebP/AVIF)
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      IMGPROXY_ENFORCE_WEBP: "true"
      # Quality settings
      IMGPROXY_QUALITY: 80
      # Development settings
      IMGPROXY_DEVELOPMENT_ERRORS_MODE: "true"
      IMGPROXY_LOG_LEVEL: "debug"
    ports:
      - "8081:8080"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend-network

  # Development utilities
  maildev:
    image: maildev/maildev
    ports:
      - "1080:1080"  # Web interface
      - "1025:1025"  # SMTP server
    environment:
      - MAILDEV_INCOMING_USER=admin
      - MAILDEV_INCOMING_PASS=password
    networks:
      - backend-network

  # pgadmin for database management
  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend-network
      
  # Redis for caching
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
  redis_data:

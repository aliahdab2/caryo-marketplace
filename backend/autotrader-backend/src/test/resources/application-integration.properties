# Integration Test Configuration
# Database properties are dynamically set by Testcontainers

# Disable external services for integration tests
carquery.api.enabled=false
syriacars.enabled=false

# JWT configuration (inherited from application.properties)
# app.jwtSecret is set in application.properties

# Disable S3 storage for integration tests
storage.type=local
storage.s3.enabled=false

# Rate Limiting Configuration for Integration Tests - DISABLED
app.ratelimit.enabled=false

# Test-specific configurations
spring.test.database.replace=none
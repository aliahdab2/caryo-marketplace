# Test-specific database properties (H2 in-memory for unit tests)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS jsonb AS JSON
spring.datasource.username=sa
spring.datasource.password=
# Use canonical kebab-case to properly override base config's org.postgresql.Driver
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${TEST_DB_PLATFORM:org.hibernate.dialect.H2Dialect}

# Flyway configuration for test environment
spring.flyway.enabled=false

# Hibernate configuration for tests
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.type.preferred_json_mapper=jackson

# JWT configuration for tests
app.jwtSecret=testSuperSecretKeyForJWTTokenGenerationThatIsLongEnoughForHS256AlgorithmAndShouldBeAtLeast256BitsLongForTesting
app.jwtExpirationInMs=86400000

# Disable SpringDoc in tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Disable S3 storage for tests - use NoOpStorageService instead
storage.s3.enabled=false

# Email configuration for tests - enable mock configuration
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.test-connection=false

# Application email configuration for tests
app.email.from=test@example.com
app.email.support=support@example.com
app.email.admin=admin@example.com
app.website.name=Test Caryo Marketplace
app.website.name.ar=سوق كاريو للاختبار
app.website.url=http://localhost:3000
app.website.support-email=support@example.com
app.website.support-phone=+963-XXX-XXXX
app.email.default-language=en
app.email.supported-languages=en,ar

# Disable mail health check for tests
management.health.mail.enabled=false

# CarQuery API Configuration for Tests - DISABLED
carquery.api.enabled=false
carquery.api.base-url=http://localhost:8080/mock-carquery
carquery.api.timeout=5
carquery.api.retry.max-attempts=1
carquery.api.retry.delay=100
carquery.api.cache.ttl=60

# SyrianCars Configuration for Tests - DISABLED
syriacars.enabled=false
syriacars.scraping.enabled=false
syriacars.website.url=http://localhost:8080/mock-syriacars
syriacars.scraping.timeout=5000

# OpenAI Translation Configuration for Tests - MOCK
openai.api.key=test-mock-key-for-testing-only
openai.model=gpt-4o
openai.timeout=5

# Data Approval Workflow Configuration for Tests - DISABLED
approval.auto-approval.enabled=false
approval.auto-approval.high-confidence-threshold=0.9
approval.auto-approval.medium-confidence-threshold=0.7
approval.auto-approval.min-rules=1
approval.bulk-approval.max-items=10
approval.cleanup.retention-days=1

# Confidence Calculation Configuration for Tests
approval.confidence.base-score=0.5
approval.confidence.openai-bonus=0.1
approval.confidence.translation-bonus=0.1
approval.confidence.known-brand-bonus=0.1

# File upload path for tests
app.upload.image-base-path=test-listings

# Data Initialization Configuration for Tests - DISABLED
app.data.initialize.enabled=false

# Rate Limiting Configuration for Tests - DISABLED
app.ratelimit.enabled=false

# Full-Text Search - DISABLED for H2 (no tsvector support)
app.search.fulltext.enabled=false

# Cache Configuration for Tests
spring.cache.type=simple
spring.cache.cache-names=brands,models,locations,carqueryMakes,carqueryModels,translations
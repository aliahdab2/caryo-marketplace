# Test Configuration

# Use H2 in-memory database for tests (PostgreSQL compatibility)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate properties for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Flyway for tests (we use ddl-auto=create-drop)
spring.flyway.enabled=false

# Email configuration for tests (mock)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Application specific properties for tests
app.frontend.url=http://localhost:3000
app.email.from=test@example.com
app.email.support=support@example.com
app.website.name=Test AutoTrader
app.website.name.ar=أوتو تريدر للاختبار
app.website.url=http://localhost:3000
app.website.support-email=support@example.com
app.website.support-phone=+963-XXX-XXXX
app.email.default-language=en
app.email.supported-languages=en,ar

# Logging configuration for tests
logging.level.com.autotrader=INFO
logging.level.org.springframework.mail=WARN
logging.level.org.hibernate=WARN

# Security configuration for tests
app.jwtSecret=testSecretKey
app.jwtExpirationMs=86400000

# Disable security for some tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Thymeleaf configuration for email templates
spring.thymeleaf.prefix=classpath:/templates/emails/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Disable mail health check for tests
management.health.mail.enabled=false

# Disable S3 storage for tests
storage.s3.enabled=false
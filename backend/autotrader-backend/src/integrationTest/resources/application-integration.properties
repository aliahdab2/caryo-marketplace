# Integration Test Configuration with Testcontainers
# Database configuration is set dynamically by Testcontainers

# Hibernate configuration for integration tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable external services for integration tests
carquery.api.enabled=false
syriacars.enabled=false

# Mock OpenAI configuration
openai.api.key=test-key-for-integration-tests
openai.model=gpt-4o

# JWT configuration for integration tests
app.jwtSecret=mySecretKeyForIntegrationTestsNeedsToBeAtLeast256BitsLongForHS256Algorithm
app.jwtExpirationInMs=86400000

# Disable S3 storage for integration tests
storage.type=local
storage.s3.enabled=false

# Logging configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.com.autotrader.autotraderbackend=DEBUG

# Test-specific configurations
spring.test.database.replace=none

# Development profile specific properties
spring.banner.location=classpath:banners/banner-dev.txt
# Add other development-specific properties below
logging.level.root=INFO
logging.level.com.autotrader=DEBUG

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/autotrader
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# Email configuration (MailDev for development, localhost for CI)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:test@example.com}
spring.mail.password=${MAIL_PASSWORD:testpassword}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# Thymeleaf configuration for email templates
spring.thymeleaf.prefix=classpath:/templates/emails/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Force UTF-8 encoding for properties
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Custom application settings
app.env=development
app.email.from=noreply@autotrader.com
app.email.support=support@autotrader.com

# Website configuration
app.website.name=AutoTrader
app.website.name.ar=أوتو تريدر
app.website.url=http://localhost:3000
app.website.support-email=support@autotrader.com
app.website.support-phone=+963-XXX-XXXX
app.email.default-language=en
app.email.supported-languages=en,ar

# Disable mail health check to avoid connection errors in CI
management.health.mail.enabled=false

# Disable mail autoconfiguration to prevent SMTP connection attempts during startup in CI
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

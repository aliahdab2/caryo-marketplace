# Production profile specific properties
spring.banner.location=classpath:banners/banner-prod.txt

# Logging configuration for production
logging.level.root=WARN
logging.level.com.autotrader=INFO

# Database configuration (use environment variables)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Email configuration for production (SendGrid example)
spring.mail.host=${SMTP_HOST:smtp.sendgrid.net}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:apikey}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8

# Thymeleaf configuration for email templates
spring.thymeleaf.prefix=classpath:/templates/emails/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=true

# Custom application settings
app.env=production
app.email.from=${EMAIL_FROM:noreply@autotrader.com}
app.email.support=${EMAIL_SUPPORT:support@autotrader.com}

# Website configuration
app.website.name=${WEBSITE_NAME:AutoTrader}
app.website.name.ar=${WEBSITE_NAME_AR:أوتو تريدر}
app.website.url=${WEBSITE_URL:https://autotrader.com}
app.website.support-email=${WEBSITE_SUPPORT_EMAIL:support@autotrader.com}

# Email language settings
app.email.default-language=${EMAIL_DEFAULT_LANGUAGE:en}
app.email.supported-languages=${EMAIL_SUPPORTED_LANGUAGES:en,ar}

# Security settings
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# AWS S3 configuration
aws.s3.bucket-name=${S3_BUCKET_NAME}
aws.s3.region=${AWS_REGION}
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# Production profile specific properties
spring.banner.location=classpath:banners/banner-prod.txt

# Logging configuration for production
logging.level.root=WARN
logging.level.com.autotrader=INFO

# Flyway configuration for production
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Database configuration (use environment variables)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Email configuration for production
# Uses MailHog/MailPit for development/testing (same as dev environment)
# For real production, set SMTP_HOST to your actual SMTP server
spring.mail.host=${SMTP_HOST:mailhog}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# Thymeleaf configuration for email templates
spring.thymeleaf.prefix=classpath:/templates/emails/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=true

# Force UTF-8 encoding for servlet requests/responses
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Custom application settings
app.env=production
app.email.from=${EMAIL_FROM:noreply@caryo.sy}
app.email.support=${EMAIL_SUPPORT:support@caryo.sy}

# Website configuration
app.website.name=${WEBSITE_NAME:Caryo Marketplace}
app.website.name.ar=${WEBSITE_NAME_AR:كاريو}
app.website.url=${WEBSITE_URL:https://caryo.sy}
app.website.support-email=${WEBSITE_SUPPORT_EMAIL:support@caryo.sy}
app.website.support-phone=${WEBSITE_SUPPORT_PHONE:+963-XXX-XXXX}

# Email language settings
app.email.default-language=${EMAIL_DEFAULT_LANGUAGE:en}
app.email.supported-languages=${EMAIL_SUPPORTED_LANGUAGES:en,ar}

# Security settings
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# AWS S3 configuration
aws.s3.bucket-name=${S3_BUCKET_NAME}
aws.s3.region=${AWS_REGION}
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
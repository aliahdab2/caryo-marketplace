# CI profile specific properties
# This profile is used for Postman API tests in CI environment

# Use default H2 database configuration (from application.properties)
# But override with CI-specific email configuration

# Email configuration for CI (mock SMTP)  
spring.mail.host=localhost
spring.mail.port=25
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# Application email configuration for CI
app.email.from=test@example.com
app.email.support=support@example.com

# Website configuration for CI
app.website.name=Test AutoTrader  
app.website.name.ar=أوتو تريدر للاختبار
app.website.url=http://localhost:3000
app.website.support-email=support@example.com
app.website.support-phone=+1-XXX-XXXX

# Email language settings
app.email.default-language=en
app.email.supported-languages=en,ar

# Disable mail health check for CI
management.health.mail.enabled=false
# CI profile specific properties - minimal configuration for CI environments
# This profile avoids all network connections during startup

# Use in-memory database for CI (faster, no network)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# Disable Flyway migrations in CI (use schema.sql instead for speed)
spring.flyway.enabled=false

# Use schema.sql for fast CI database setup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop

# Disable all mail functionality
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
management.health.mail.enabled=false

# Disable S3 storage (no MinIO connectivity)
storage.s3.enabled=false

# Minimal logging for CI
logging.level.root=WARN
logging.level.com.autotrader=INFO

# Disable unnecessary features for CI
spring.thymeleaf.cache=true
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

# Basic app settings for CI
app.env=ci
app.website.name=AutoTrader CI
app.website.url=http://localhost:8080
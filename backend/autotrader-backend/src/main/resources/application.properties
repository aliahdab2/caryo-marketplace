spring.application.name=autotrader-backend
server.port=8080
spring.main.allow-bean-definition-overriding=true

# Encoding Configuration
spring.messages.encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=false

# JWT Configuration
autotrader.app.jwtSecret=autotraderSecretKey123456789012345678901234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
autotrader.app.jwtExpirationMs=86400000

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.autotrader.autotraderbackend=INFO
logging.level.com.autotrader.autotraderbackend.service.storage=INFO
logging.level.com.autotrader.autotraderbackend.service.CarListingService=INFO

# File Upload Configuration (Updated for Caryo video support)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.upload.max-file-size=5242880

# Allowed Media Types (Following Caryo supported formats)
app.upload.allowed-types=image/jpeg,image/png,image/gif,image/webp,video/mp4,video/quicktime,video/x-msvideo,video/webm,video/x-ms-wmv,video/x-flv,video/mpeg,video/3gpp
app.upload.image-base-path=listings

# Video Configuration (Following Caryo best practices)
app.upload.video-upload-enabled=true
app.upload.video-url-enabled=true
app.upload.max-video-size=104857600
app.upload.max-video-duration=180
app.upload.max-videos-per-listing=1
app.upload.max-external-videos-per-listing=1

# ========================================
# STORAGE CONFIGURATION
# ========================================
# S3-Compatible Storage Service Configuration
# Supports both AWS S3 (production) and MinIO (development)

# General Storage Settings
storage.general.default-bucket-name=${STORAGE_DEFAULT_BUCKET_NAME:caryo-assets}
storage.general.base-url=${STORAGE_BASE_URL:http://localhost:9000}
storage.general.public-access-enabled=${STORAGE_PUBLIC_ACCESS:true}
storage.general.default-region=${STORAGE_DEFAULT_REGION:us-east-1}

# S3-Compatible Service Configuration
storage.s3.enabled=${STORAGE_S3_ENABLED:true}
storage.s3.endpoint-url=${STORAGE_ENDPOINT_URL:http://localhost:9000}
storage.s3.access-key-id=${STORAGE_ACCESS_KEY:minioadmin}
storage.s3.secret-access-key=${STORAGE_SECRET_KEY:minioadmin}
storage.s3.bucket-name=${STORAGE_BUCKET_NAME:caryo-assets}
storage.s3.region=${STORAGE_REGION:us-east-1}
storage.s3.path-style-access-enabled=${STORAGE_PATH_STYLE_ACCESS:true}
storage.s3.signed-url-expiration-seconds=${STORAGE_SIGNED_URL_EXPIRATION:3600}

# Storage Key Patterns Configuration
# Available placeholders: {listingId}, {userId}, {timestamp}, {filename}, {category}, {uuid}, {date}, {level}, {originalPath}
storage.key-patterns.listing-media=${STORAGE_KEY_LISTING_MEDIA:listings/{listingId}/{timestamp}_{filename}}
storage.key-patterns.user-avatar=${STORAGE_KEY_USER_AVATAR:users/{userId}/avatar_{timestamp}_{filename}}
storage.key-patterns.temp-uploads=${STORAGE_KEY_TEMP_UPLOADS:temp/{uuid}_{filename}}
storage.key-patterns.sample-data=${STORAGE_KEY_SAMPLE_DATA:samples/{category}/{filename}}
storage.key-patterns.documents=${STORAGE_KEY_DOCUMENTS:documents/{category}/{timestamp}_{filename}}
storage.key-patterns.thumbnails=${STORAGE_KEY_THUMBNAILS:thumbnails/{originalPath}/{filename}}
storage.key-patterns.backups=${STORAGE_KEY_BACKUPS:backups/{date}/{category}/{filename}}
storage.key-patterns.logs=${STORAGE_KEY_LOGS:logs/{date}/{level}/{filename}}

# Legacy Configuration (for backwards compatibility)
aws.s3.bucket-name=${STORAGE_BUCKET_NAME:caryo-assets}
aws.s3.force-path-style=${STORAGE_PATH_STYLE_ACCESS:true}

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.csrf.enabled=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=WHEN_AUTHORIZED
management.health.defaults.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=db,diskSpace
springdoc.api-docs.enabled=true
springdoc.packages-to-scan=com.autotrader.autotraderbackend.controller

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600
spring.web.cors.exposed-headers=Authorization

# Email Configuration (Basic - for development/testing)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false

# Thymeleaf Configuration for Email Templates
spring.thymeleaf.prefix=classpath:/templates/emails/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true

# Force UTF-8 encoding for servlet requests/responses
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Application Email Configuration
app.email.from=noreply@caryo.sy
app.email.support=support@caryo.sy

# Website Configuration
app.website.name=Caryo Marketplace
app.website.name.ar=كاريو
app.website.url=http://localhost:3000
app.website.support-email=support@caryo.sy
app.website.support-phone=+963-XXX-XXXX

# Email Service Configuration
app.email.default-language=en
app.email.supported-languages=en,ar

# Banner Configuration
spring.banner.location=classpath:banners/banner.txt
# Use the profile-specific banner when a profile is active

# Spring Boot Application Properties
spring.main.banner-mode=console
# Set to 'off' to disable the banner, 'console' to show in console, 'log' to show in logs

# ========================================
# LISTING ARCHIVED EVENT CONFIGURATION
# ========================================
# Configuration for listing archival notifications and event handling

# Enable/disable admin notification emails for listing archival
app.notifications.listing-archived.admin.enabled=true

# Maximum retry attempts for email notifications (default: 3)
app.notifications.listing-archived.max-retries=3

# Timeout for email sending operations in seconds (default: 30)
app.notifications.listing-archived.email-timeout-seconds=30

# Enable/disable detailed logging for archival events
app.notifications.listing-archived.detailed-logging=true

# Batch size for processing multiple archival events (default: 10)
app.notifications.listing-archived.batch-size=10

# ========================================
# EMAIL NOTIFICATION CONFIGURATION
# ========================================
# General email notification settings

# Enable/disable all email notifications
app.notifications.email.enabled=true

# Email retry configuration
app.notifications.email.max-retries=3
app.notifications.email.retry-delay-ms=1000
app.notifications.email.exponential-backoff=true

# Email template configuration
app.notifications.email.templates.listing-archived-admin=listing-archived-by-admin.html
app.notifications.email.templates.listing-archived-seller=listing-archived-by-seller.html

# ========================================
# EVENT PROCESSING CONFIGURATION
# ========================================
# Configuration for asynchronous event processing

# Enable/disable async event processing
app.events.async.enabled=true

# Thread pool configuration for event processing
app.events.async.core-pool-size=5
app.events.async.max-pool-size=20
app.events.async.queue-capacity=100
app.events.async.thread-name-prefix=event-processor-

# Event processing timeouts
app.events.processing.timeout-seconds=60
app.events.processing.retry-enabled=true
app.events.processing.retry-max-attempts=3

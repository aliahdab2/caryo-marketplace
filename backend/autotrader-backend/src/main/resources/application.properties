# Application Configuration
spring.application.name=caryo-marketplace

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/autotrader_db
spring.datasource.username=autotrader_user
spring.datasource.password=autotrader_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server Configuration
server.port=8080
server.servlet.context-path=/

# HTTP Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

# JWT Configuration
app.jwtSecret=mySuperSecretKeyForJWTTokenGenerationThatIsLongEnoughForHS256AlgorithmAndShouldBeAtLeast256BitsLong
app.jwtExpirationInMs=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MinIO Configuration (S3-compatible storage)
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=autotrader-uploads
minio.region=us-east-1

# Application-specific settings
app.upload.dir=uploads/
app.upload.max-file-size=5242880
app.default-page-size=20

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Website Configuration
app.website.name=${WEBSITE_NAME:Caryo}
app.website.name.ar=${WEBSITE_NAME_AR:كاريو}
app.website.url=${WEBSITE_URL:http://localhost:3000}
app.website.support-email=${WEBSITE_SUPPORT_EMAIL:support@caryo.sy}
app.website.support-phone=${WEBSITE_SUPPORT_PHONE:+963-11-123-4567}

# Email Template Configuration
app.email.from=${EMAIL_FROM:noreply@caryo.sy}
app.email.support=${EMAIL_SUPPORT:support@caryo.sy}
app.email.templates.path=classpath:templates/emails/
app.email.default-language=en
app.email.supported-languages=en,ar

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# Logging Configuration
logging.level.com.autotrader.autotraderbackend=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Security Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# OAuth2 Configuration (Google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/oauth2/callback/google}

# Newsletter Configuration
app.newsletter.enabled=${NEWSLETTER_ENABLED:true}
app.newsletter.confirmation-url=${NEWSLETTER_CONFIRMATION_URL:http://localhost:3000/newsletter/confirm}
app.newsletter.unsubscribe-url=${NEWSLETTER_UNSUBSCRIBE_URL:http://localhost:3000/newsletter/unsubscribe}

# Contact Form Configuration
app.contact.admin-email=${CONTACT_ADMIN_EMAIL:admin@caryo.sy}
app.contact.rate-limit.enabled=${CONTACT_RATE_LIMIT_ENABLED:true}
app.contact.rate-limit.max-requests=${CONTACT_RATE_LIMIT_MAX:5}
app.contact.rate-limit.time-window=${CONTACT_RATE_LIMIT_WINDOW:3600}

# Password Reset Configuration
app.password-reset.token-expiry=${PASSWORD_RESET_TOKEN_EXPIRY:3600}
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password}

# Data Initialization Configuration
app.data.initialize.enabled=${DATA_INIT_ENABLED:true}

# Retry Configuration
app.retry.max-attempts=${RETRY_MAX_ATTEMPTS:3}
app.retry.delay=${RETRY_DELAY:1000}

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=brands,models,locations

# Validation Configuration
app.validation.strict-mode=${VALIDATION_STRICT_MODE:false}

# Development Configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Banner Configuration
spring.banner.location=classpath:banners/banner.txt

# CarQuery API Configuration
carquery.api.enabled=${CARQUERY_ENABLED:true}
carquery.api.base-url=${CARQUERY_BASE_URL:https://www.carqueryapi.com/api/0.3/}
carquery.api.timeout=${CARQUERY_TIMEOUT:60000}
carquery.api.retry.max-attempts=${CARQUERY_RETRY_MAX:3}
carquery.api.retry.delay=${CARQUERY_RETRY_DELAY:2000}
carquery.api.cache.ttl=${CARQUERY_CACHE_TTL:3600}

# Caryo API Configuration (Future)
caryo.api.enabled=${CARYO_API_ENABLED:false}
caryo.api.base-url=${CARYO_API_BASE_URL:https://api.caryo.sy/v1/}
caryo.api.timeout=${CARYO_API_TIMEOUT:30}

# SyrianCars Configuration
syriacars.enabled=true
syriacars.scraping.enabled=true
syriacars.website.url=https://www.syriacars.net
syriacars.scraping.timeout=30000


# Application Configuration
spring.application.name=caryo-marketplace

# ========================================
# Database Configuration
# ========================================
# SECURITY WARNING: Never commit real credentials!
# - These defaults are for LOCAL DEVELOPMENT ONLY
# - Set via environment variables in .env file (see .env.example)
# - Use STRONG passwords in production (generate with: openssl rand -base64 32)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/autotrader_db}
spring.datasource.username=${DATABASE_USERNAME:autotrader_user}
spring.datasource.password=${DATABASE_PASSWORD:autotrader_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server Configuration
server.port=8080
server.servlet.context-path=/

# HTTP Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

# HTTP Response Compression (mobile optimization)
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# ========================================
# JWT Configuration
# ========================================
# SECURITY CRITICAL: JWT_SECRET must be set via environment variable!
# - NEVER commit JWT secrets to git
# - Generate strong secret with: openssl rand -base64 64
# - Use DIFFERENT secrets for dev/staging/production
# - Minimum 256 bits (32 bytes) recommended
# - Rotate periodically (quarterly recommended)
app.jwtSecret=${JWT_SECRET}
# Token expiration: 30 minutes for better security (use refresh tokens for longer sessions)
app.jwtExpirationInMs=${JWT_EXPIRATION_MS:1800000}
# Refresh token expiration: 30 days
app.jwtRefreshExpirationInMs=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================================
# MinIO/S3 Configuration (S3-compatible storage)
# ========================================
# SECURITY WARNING: Change default credentials!
# - Defaults (minioadmin) are for LOCAL DEVELOPMENT ONLY
# - Generate production keys:
#   - Access Key: openssl rand -hex 20
#   - Secret Key: openssl rand -base64 32
# - Set via environment variables in .env file
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:autotrader-uploads}
minio.region=${MINIO_REGION:us-east-1}

# Application-specific settings
app.upload.dir=uploads/
app.upload.max-file-size=5242880
app.default-page-size=20

# Imgproxy Configuration
imgproxy.url=${IMGPROXY_URL:http://localhost:8081}
imgproxy.key=${IMGPROXY_KEY:}
imgproxy.salt=${IMGPROXY_SALT:}
imgproxy.bucket=${IMGPROXY_BUCKET:caryo-assets}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Website Configuration
app.website.name=${WEBSITE_NAME:Caryo}
app.website.name.ar=${WEBSITE_NAME_AR:كاريو}
app.website.url=${WEBSITE_URL:http://localhost:3000}
app.website.support-email=${WEBSITE_SUPPORT_EMAIL:support@caryo.sy}
app.website.support-phone=${WEBSITE_SUPPORT_PHONE:+963-11-123-4567}

# Email Template Configuration
app.email.from=${EMAIL_FROM:noreply@caryo.sy}
app.email.support=${EMAIL_SUPPORT:support@caryo.sy}
app.email.admin=${EMAIL_ADMIN:admin@caryo.sy}
app.email.templates.path=classpath:templates/emails/
app.email.default-language=en
app.email.supported-languages=en,ar

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# Logging Configuration
logging.level.com.autotrader.autotraderbackend=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ========================================
# Security Configuration
# ========================================
# CORS Configuration
# SECURITY WARNING: Configure carefully for production!
# - Development: http://localhost:3000,http://localhost:3001
# - Production: HTTPS ONLY (https://caryo.sy,https://www.caryo.sy)
# - NEVER use wildcards (*) in production
# - NEVER mix HTTP and HTTPS in production
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# ========================================
# OAuth2 Configuration (Google)
# ========================================
# Get credentials from: https://console.cloud.google.com/apis/credentials
# SECURITY: Set via environment variables, not default values
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/oauth2/callback/google}

# Newsletter Configuration
app.newsletter.enabled=${NEWSLETTER_ENABLED:true}
app.newsletter.confirmation-url=${NEWSLETTER_CONFIRMATION_URL:http://localhost:3000/newsletter/confirm}
app.newsletter.unsubscribe-url=${NEWSLETTER_UNSUBSCRIBE_URL:http://localhost:3000/newsletter/unsubscribe}

# Contact Form Configuration
app.contact.admin-email=${CONTACT_ADMIN_EMAIL:admin@caryo.sy}
app.contact.rate-limit.enabled=${CONTACT_RATE_LIMIT_ENABLED:true}
app.contact.rate-limit.max-requests=${CONTACT_RATE_LIMIT_MAX:5}
app.contact.rate-limit.time-window=${CONTACT_RATE_LIMIT_WINDOW:3600}

# Password Reset Configuration
# Token expiry: 24 hours (86400 seconds) for better user experience
app.password-reset.token-expiry=${PASSWORD_RESET_TOKEN_EXPIRY:86400}
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password}

# Data Initialization Configuration
app.data.initialize.enabled=${DATA_INIT_ENABLED:true}

# Retry Configuration
app.retry.max-attempts=${RETRY_MAX_ATTEMPTS:3}
app.retry.delay=${RETRY_DELAY:1000}

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=brands,models,locations

# Validation Configuration
app.validation.strict-mode=${VALIDATION_STRICT_MODE:false}

# Development Configuration
# Profile is set via command line arguments: --spring.profiles.active=test

# Banner Configuration
spring.banner.location=classpath:banners/banner.txt

# CarQuery API Configuration
carquery.api.enabled=${CARQUERY_ENABLED:true}
carquery.api.base-url=${CARQUERY_BASE_URL:https://www.carqueryapi.com/api/0.3/}
carquery.api.timeout=${CARQUERY_TIMEOUT:60000}
carquery.api.retry.max-attempts=${CARQUERY_RETRY_MAX:3}
carquery.api.retry.delay=${CARQUERY_RETRY_DELAY:2000}
carquery.api.cache.ttl=${CARQUERY_CACHE_TTL:3600}

# Caryo API Configuration (Future)
caryo.api.enabled=${CARYO_API_ENABLED:false}
caryo.api.base-url=${CARYO_API_BASE_URL:https://api.caryo.sy/v1/}
caryo.api.timeout=${CARYO_API_TIMEOUT:30}

# SyrianCars Configuration
syriacars.enabled=true
syriacars.scraping.enabled=true
syriacars.website.url=https://www.syriacars.net
syriacars.scraping.timeout=30000

# ========================================
# OpenAI Translation Configuration
# ========================================
# SECURITY CRITICAL: Protect your OpenAI API key!
# - NEVER commit API keys to git
# - If exposed, revoke immediately at: https://platform.openai.com/api-keys
# - Generate new key and set via environment variable
# - See docs/OPENAI_KEY_REVOCATION.md for revocation steps
# - Monitor usage at: https://platform.openai.com/usage
openai.api.key=${OPENAI_API_KEY}
openai.model=gpt-4o-mini
openai.timeout=30

# Dealer Trial Configuration (Phase 1A)
dealer.trial.enabled=true
dealer.trial.duration_months=2
dealer.trial.listing_limit=15
dealer.trial.grace_period_days=3

# Regular User Listing Limits
# Maximum active listings for non-dealer users (private sellers)
user.regular.listing_limit=5

# Subscription Tiers Configuration
subscription.basic.price=50
subscription.basic.listing_limit=100
subscription.advanced.price=100
subscription.advanced.listing_limit=250
subscription.professional.price=200
subscription.professional.listing_limit=-1

# Payment Provider Configuration (Phase 1B - Enhanced)
payment.paypal.enabled=${PAYPAL_ENABLED:false}
payment.paypal.client_id=${PAYPAL_CLIENT_ID:}
payment.paypal.client_secret=${PAYPAL_CLIENT_SECRET:}
payment.paypal.mode=${PAYPAL_MODE:sandbox}
payment.paypal.webhook_id=${PAYPAL_WEBHOOK_ID:}
payment.paypal.success_url=${PAYPAL_SUCCESS_URL:http://localhost:3000/payment/success}
payment.paypal.cancel_url=${PAYPAL_CANCEL_URL:http://localhost:3000/payment/cancel}

payment.stripe.enabled=${STRIPE_ENABLED:false}
payment.stripe.api_key=${STRIPE_API_KEY:}
payment.stripe.webhook_secret=${STRIPE_WEBHOOK_SECRET:}
payment.stripe.success_url=${STRIPE_SUCCESS_URL:http://localhost:3000/payment/success}
payment.stripe.cancel_url=${STRIPE_CANCEL_URL:http://localhost:3000/payment/cancel}
# Stripe Price IDs (configured in Stripe Dashboard)
payment.stripe.prices.basic=${STRIPE_PRICE_BASIC:price_basic_monthly}
payment.stripe.prices.advanced=${STRIPE_PRICE_ADVANCED:price_advanced_monthly}
payment.stripe.prices.professional=${STRIPE_PRICE_PROFESSIONAL:price_professional_monthly}

# Payment Configuration
# Manual Bank Transfer Settings
payment.manual_transfer.enabled=true
payment.manual_transfer.bank_name=${BANK_NAME:Cham Bank}
payment.manual_transfer.account_number=${BANK_ACCOUNT:123456789}
payment.manual_transfer.account_name=${BANK_ACCOUNT_NAME:Caryo Marketplace}
payment.manual_transfer.iban=${BANK_IBAN:SY12345678901234567890}
payment.manual_transfer.swift_code=${BANK_SWIFT:CHAMSYNX}
payment.manual_transfer.branch=${BANK_BRANCH:Damascus Main Branch}

# Global Payment Settings
payment.global.max_payment_amount=${MAX_PAYMENT_AMOUNT:10000}
payment.global.min_payment_amount=${MIN_PAYMENT_AMOUNT:1}
payment.global.default_currency=${DEFAULT_CURRENCY:SYP}
payment.global.default-currency=USD
payment.global.max-payment-amount=1000000
payment.global.min-payment-amount=1
payment.global.timeout-seconds=300
payment.global.audit-enabled=true
payment.global.idempotency-enabled=true

# Your Business Bank Account Details
payment.manual-transfer.enabled=true
payment.manual-transfer.bank-account.bank-name=YOUR_BANK_NAME
payment.manual-transfer.bank-account.account-number=YOUR_ACCOUNT_NUMBER
payment.manual-transfer.bank-account.account-name=YOUR_BUSINESS_NAME
payment.manual-transfer.bank-account.iban=YOUR_IBAN_NUMBER
payment.manual-transfer.bank-account.swift-code=YOUR_SWIFT_CODE
payment.manual-transfer.bank-account.branch=YOUR_BRANCH_NAME
payment.manual-transfer.verification-timeout-hours=72
payment.manual-transfer.auto-expire-hours=168

# Future Payment Providers (Disabled for now)
payment.cham-bank.enabled=false
payment.bemo-bank.enabled=false

# Feature Flags
features.trial_system.enabled=true
features.dealer_dashboard.enabled=true
features.analytics_advanced.enabled=false
features.email_notifications.enabled=true
features.sms_notifications.enabled=false

# ============================================
# Circuit Breaker Configuration (Resilience4j)
# ============================================
# Protects against cascading failures from external APIs

# CarQuery API Circuit Breaker
resilience4j.circuitbreaker.instances.carquery.sliding-window-size=10
resilience4j.circuitbreaker.instances.carquery.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.carquery.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.carquery.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.carquery.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.instances.carquery.slow-call-rate-threshold=80

# OpenAI API Circuit Breaker
resilience4j.circuitbreaker.instances.openai.sliding-window-size=10
resilience4j.circuitbreaker.instances.openai.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.openai.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.openai.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.openai.slow-call-duration-threshold=10s
resilience4j.circuitbreaker.instances.openai.slow-call-rate-threshold=80

# Circuit Breaker Health Indicator (for /actuator/health)
management.health.circuitbreakers.enabled=true

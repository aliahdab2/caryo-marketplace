openai.api.key=${OPENAI_API_KEY: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}

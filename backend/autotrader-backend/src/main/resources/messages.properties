# Password reset emails
email.password_reset.subject=Password Reset Request - {websiteName}
email.password_reset.title=Password Reset Request
email.password_reset.message=We received a request to reset your password for your {websiteName} account.
email.password_reset.instruction=Click the button below to reset your password:
email.password_reset.button=Reset Password
email.password_reset.expire_notice=This link will expire in 24 hours for security reasons.
email.password_reset.no_request=If you didn't request this password reset, please ignore this email or contact our support team.
email.password_reset.security_tip=For your security, never share your password with anyone.

# Password reset confirmation emails
email.password_reset_confirmation.subject=Password Successfully Changed - {websiteName}
email.password_reset_confirmation.title=Password Changed Successfully
email.password_reset_confirmation.message=Your password has been successfully changed for your {websiteName} account.
email.password_reset_confirmation.security_notice=If you didn't make this change, please contact our support team immediately.
email.password_reset_confirmation.login_button=Login to Your Account
email.password_reset.security_alert=Didn't make this change?
email.password_reset.security_message=If you did not change your password, please contact our support team immediately at {supportEmail} or phone {supportPhone}.


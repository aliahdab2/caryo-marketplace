# Test profile specific properties
spring.banner.location=classpath:banners/banner-test.txt
# Add other test-specific properties below
logging.level.root=INFO
logging.level.com.autotrader=DEBUG

# Flyway configuration for test environment - enabled with H2 compatibility
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration,classpath:db/test
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Test-specific configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Email configuration for tests - enable mock configuration
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.test-connection=false

# Application email configuration for tests
app.email.from=test@example.com
app.email.support=support@example.com
app.website.name=Test AutoTrader
app.website.name.ar=أوتو تريدر للاختبار
app.website.url=http://localhost:3000
app.website.support-email=support@example.com
app.website.support-phone=+963-XXX-XXXX
app.email.default-language=en
app.email.supported-languages=en,ar

# Disable mail health check for tests
management.health.mail.enabled=false

# Disable S3 storage for tests
storage.s3.enabled=false

# Thymeleaf configuration for email templates
spring.thymeleaf.prefix=classpath:/templates/emails/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

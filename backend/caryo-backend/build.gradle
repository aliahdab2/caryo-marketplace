import org.gradle.api.GradleException

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.flywaydb.flyway' version '11.8.2'
}

group = 'com.caryo'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Handle duplicate JARs in bootJar (jakarta.mail comes from both starter-mail and explicit dep)
tasks.named('bootJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'  // Added for caching
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.retry:spring-retry:2.0.12'       // Added for retry support
    implementation 'org.springframework.boot:spring-boot-starter-aop'    // Required for retry aspects

    // Resilience4j for circuit breakers
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.3.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.3.0'
    implementation 'org.springframework.boot:spring-boot-starter-mail'   // Added for email functionality
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf' // Added for email templates
    implementation 'com.sun.mail:jakarta.mail:2.0.2' // Jakarta Mail implementation
    
    // Flyway for database migrations (Flyway 10+ requires database-specific module)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Utilities
    implementation 'com.google.code.findbugs:jsr305:3.0.2'         // JSR 305 (@NonNull, @Nullable)
    implementation 'org.apache.commons:commons-lang3:3.20.0'       // Apache Commons Lang

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    // API Documentation (2.8.6 is compatible with Spring Boot 3.x)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Web scraping for SyrianCars.net data
    implementation 'org.jsoup:jsoup:1.22.1'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // File type detection
    implementation 'org.apache.tika:tika-core:3.2.3'

    // AWS SDK (S3-compatible storage - works with MinIO)
    implementation platform('software.amazon.awssdk:bom:2.42.24')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:url-connection-client'

    // Apache POI for Excel processing
    implementation 'org.apache.poi:poi:5.5.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'

    // Dev Tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'com.h2database:h2:2.2.224'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:minio:1.21.4'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.6'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Common configuration for all test tasks
def configureTestTask = { task ->
    task.useJUnitPlatform()
    task.testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = 'full'
        showStandardStreams = true
    }
    task.afterSuite { desc, result ->
        if (desc.parent == null) { // will match the outermost suite
            println "\n${task.name.capitalize()} Summary: ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
            
            // Save this information to a file so it can be retrieved by GitHub Actions
            def summaryFile = new File("${task.reports.html.outputLocation.get().asFile}/test-summary.txt")
            summaryFile.text = "Total Tests: ${result.testCount}\nPassed: ${result.successfulTestCount}\nFailed: ${result.failedTestCount}\nSkipped: ${result.skippedTestCount}"
        }
    }
    task.reports {
        html.required = true
        junitXml.required = true
    }
}

// Configure the main test task to run only unit tests
tasks.named('test') {
    description = 'Runs unit tests only'
    // Only run unit tests by default (exclude integration tests)
    include '**/*Test.class'
    exclude '**/*IntegrationTest.class'
    configureTestTask(it)
}

// Create a separate task for integration tests
tasks.register('integrationTest', Test) {
    description = 'Runs integration tests only'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IntegrationTest.class'
    configureTestTask(it)

    // Integration tests should run after unit tests
    mustRunAfter tasks.named('test')
}

// Task to run all tests
tasks.register('testAll', Test) {
    description = 'Runs all tests (unit and integration)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*Test.class' // This includes both unit and integration tests
    configureTestTask(it)
}

// Configure Jacoco report to cover all tests when run
jacocoTestReport {
    // Make sure this runs after testAll if both are executed
    mustRunAfter tasks.named('testAll')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        "-Xlint:deprecation",
        "-Xlint:unchecked"
    ]
    options.annotationProcessorPath = configurations.annotationProcessor
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco')
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                // Excluding test implementations that clash with production code
                "com/caryo/marketplace/exception/TestAuthenticationExceptionHandler.class",
                "com/caryo/marketplace/config/TestResourceCleanupService.class"
            ])
        }))
    }
}

// Configure Flyway
flyway {
    url = System.getenv("FLYWAY_URL") ?: 'jdbc:postgresql://localhost:5432/caryo'
    user = System.getenv("FLYWAY_USER") ?: 'caryo'
    password = System.getenv("FLYWAY_PASSWORD") ?: 'caryo' // Use environment variable
    locations = ['filesystem:src/main/resources/db/migration']
    baselineOnMigrate = true
    validateOnMigrate = true
    cleanDisabled = false  // Enable clean for development
}

// Environment-specific Flyway tasks
tasks.register('flywayMigrateDev') {
    group = 'Database'
    description = 'Migrates the database for development environment'
    doFirst {
        flyway {
            url = System.getenv("FLYWAY_DEV_URL") ?: System.getenv("FLYWAY_URL") ?: 'jdbc:postgresql://localhost:5432/caryo'
            user = System.getenv("FLYWAY_DEV_USER") ?: System.getenv("FLYWAY_USER") ?: 'caryo'
            password = System.getenv("FLYWAY_DEV_PASSWORD") ?: System.getenv("FLYWAY_PASSWORD") ?: 'caryo'
            locations = ['filesystem:src/main/resources/db/migration', 'filesystem:src/main/resources/db/dev']
            placeholders = [
                'environment': 'development'
            ]
        }
    }
    finalizedBy flywayMigrate
}

tasks.register('flywayMigrateTest') {
    group = 'Database'
    description = 'Migrates the database for test environment'
    doFirst {
        flyway {
            url = System.getenv("FLYWAY_TEST_URL") ?: 'jdbc:postgresql://localhost:5432/caryo_test'
            user = System.getenv("FLYWAY_TEST_USER") ?: System.getenv("FLYWAY_USER") ?: 'caryo'
            password = System.getenv("FLYWAY_TEST_PASSWORD") ?: System.getenv("FLYWAY_PASSWORD") ?: 'caryo' // Use environment variable
            locations = ['filesystem:src/main/resources/db/migration', 'filesystem:src/main/resources/db/test']
            placeholders = [
                'environment': 'test'
            ]
        }
    }
    finalizedBy flywayMigrate
}

tasks.register('flywayMigrateProd') {
    group = 'Database'
    description = 'Migrates the database for production environment'
    doFirst {
        def prodUrlValue = System.getenv("FLYWAY_PROD_URL") ?: System.getenv("FLYWAY_URL")
        if (!prodUrlValue) {
            throw new GradleException("For production migration (flywayMigrateProd), the database URL must be set via either the FLYWAY_PROD_URL or FLYWAY_URL environment variable.")
        }
        def prodUserValue = System.getenv("FLYWAY_PROD_USER") ?: System.getenv("FLYWAY_USER")
        if (!prodUserValue) {
            throw new GradleException("For production migration (flywayMigrateProd), the database user must be set via either the FLYWAY_PROD_USER or FLYWAY_USER environment variable.")
        }
        def prodPasswordValue = System.getenv("FLYWAY_PROD_PASSWORD") ?: System.getenv("FLYWAY_PASSWORD")
        if (!prodPasswordValue) {
            throw new GradleException("For production migration (flywayMigrateProd), the database password must be set via either the FLYWAY_PROD_PASSWORD or FLYWAY_PASSWORD environment variable.")
        }
        flyway {
            url = prodUrlValue
            user = prodUserValue
            password = prodPasswordValue
            cleanDisabled = true
            locations = ['classpath:db/migration']
            placeholders = [
                'environment': 'production'
            ]
        }
    }
    finalizedBy flywayMigrate
}

// Database management tasks
tasks.register('createTestDb') {
    group = 'Database'
    description = 'Creates the test database if it does not exist'
    doFirst {
        exec {
            workingDir '.'
            commandLine 'docker', 'compose', '-f', 'docker-compose.dev.yml', 'exec', '-T', 'db', 
                       'psql', '-U', 'postgres', '-d', 'postgres', '-c', 
                       'CREATE DATABASE caryo_test WITH OWNER postgres;'
            ignoreExitValue = true
        }
    }
}

tasks.register('dropTestDb') {
    group = 'Database'
    description = 'Drops the test database if it exists'
    doFirst {
        exec {
            workingDir '.'
            commandLine 'docker', 'compose', '-f', 'docker-compose.dev.yml', 'exec', '-T', 'db',
                       'psql', '-U', 'postgres', '-d', 'postgres', '-c',
                       'DROP DATABASE IF EXISTS caryo_test;'
            ignoreExitValue = true
        }
    }
}

tasks.register('resetTestDb') {
    group = 'Database'
    description = 'Resets the test database (drop, create, migrate)'
    dependsOn dropTestDb
    dependsOn createTestDb
    dependsOn flywayMigrateTest
    tasks.findByName('createTestDb').mustRunAfter dropTestDb
    tasks.findByName('flywayMigrateTest').mustRunAfter createTestDb
}

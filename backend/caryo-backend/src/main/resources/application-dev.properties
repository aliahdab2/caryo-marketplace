# Development profile specific properties
spring.banner.location=classpath:banners/banner-dev.txt
# Add other development-specific properties below
logging.level.root=INFO
logging.level.com.caryo=DEBUG

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:caryo}
spring.datasource.username=${DB_USER:caryo}
spring.datasource.password=${DB_PASSWORD:caryo}

# Email configuration (Gmail SMTP for development)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:your-app-password}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8

# Thymeleaf configuration for email templates
spring.thymeleaf.prefix=classpath:/templates/emails/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true

# Force UTF-8 encoding for properties
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Custom application settings
app.env=development
app.email.from=${GMAIL_USERNAME:your-email@gmail.com}
app.email.support=${GMAIL_USERNAME:your-email@gmail.com}

# Website configuration
app.website.name=Caryo Marketplace
app.website.name.ar=كاريو  
app.website.url=http://localhost:3000
app.website.support-email=support@caryo.sy
app.website.support-phone=+963-XXX-XXXX

# Email language settings
app.email.default-language=en
app.email.supported-languages=en,ar

# Disable mail health checks in dev to avoid repeated SMTP auth error spam
management.health.mail.enabled=false

# Use Redis cache in dev (Docker service available)
spring.cache.type=redis
# Honor REDIS_HOST from the environment (Docker compose sets it to the redis
# service name); localhost only as a fallback for bare-metal runs
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

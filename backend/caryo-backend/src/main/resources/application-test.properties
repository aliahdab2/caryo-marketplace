# Test profile specific properties
spring.banner.location=classpath:banners/banner-test.txt
# Add other test-specific properties below
logging.level.root=INFO
logging.level.com.caryo=DEBUG

# Flyway configuration for test environment
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration,classpath:db/test
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false

# Database configuration for test profile (bootRun in CI)
# Uses environment variables with PostgreSQL defaults matching CI Docker services
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/caryo_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
# Use canonical kebab-case property names to ensure proper override of base config
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.postgresql.Driver}

# Test-specific JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Email configuration for tests - enable mock configuration
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.test-connection=false

# Application email configuration for tests
app.email.from=test@example.com
app.email.support=support@example.com
app.website.name=Test Caryo
app.website.name.ar=أوتو تريدر للاختبار
app.website.url=http://localhost:3000
app.website.support-email=support@example.com
app.website.support-phone=+963-XXX-XXXX
app.email.default-language=en
app.email.supported-languages=en,ar

# Disable mail health check for tests
management.health.mail.enabled=false

# Disable S3 storage for tests
storage.s3.enabled=false

# Disable car data initialization for tests
app.data.initialize.enabled=false

# Enable CarQuery API for testing our integration
carquery.api.enabled=true

# Thymeleaf configuration for email templates
spring.thymeleaf.prefix=classpath:/templates/emails/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# JWT Configuration for Test
app.jwtSecret=testSecretKeyForDevelopmentAndTestingOnly1234567890
app.jwtExpirationInMs=3600000
app.jwtRefreshExpirationInMs=86400000

# Use simple cache for tests (no Redis dependency)
spring.cache.type=simple

# Rate Limiting Configuration for Test - DISABLED
app.ratelimit.enabled=false

# OpenAI Configuration for Test
openai.api.key=sk-dummy-key-for-tests

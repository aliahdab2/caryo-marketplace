# Email Templates Configuration
# This file defines all email templates and their settings for easy management

email-templates:
  welcome:
    template-name: "welcome-enhanced"
    subject:
      en: "Welcome to {{websiteName}}!"
      ar: "مرحباً بك في {{websiteName}}!"
    description: "Welcome email sent to new users after registration"
    variables:
      - userName
      - userEmail
      - websiteName
      - websiteUrl
    features:
      - bilingual-support: true
      - responsive-design: true
      - call-to-action-buttons: true
      - branding: true

  password-reset:
    template-name: "password-reset"
    subject:
      en: "Password Reset Request - {{websiteName}}"
      ar: "طلب إعادة تعيين كلمة المرور - {{websiteName}}"
    description: "Password reset email with secure token"
    variables:
      - userName
      - resetUrl
      - websiteName
      - websiteUrl
      - expiryHours
    features:
      - bilingual-support: true
      - security-notices: true
      - token-expiry: true

  password-reset-confirmation:
    template-name: "password-reset-confirmation"
    subject:
      en: "Password Successfully Reset - {{websiteName}}"
      ar: "تم إعادة تعيين كلمة المرور بنجاح - {{websiteName}}"
    description: "Confirmation email after successful password reset"
    variables:
      - userName
      - websiteName
      - websiteUrl
      - loginUrl
    features:
      - bilingual-support: true
      - security-notices: true

  contact-form:
    template-name: "contact-form"
    subject:
      en: "New Contact Form Submission from {{senderName}}"
      ar: "رسالة جديدة من {{senderName}}"
    description: "Notification email for contact form submissions"
    variables:
      - senderName
      - senderEmail
      - message
      - timestamp
    features:
      - bilingual-support: true
      - admin-notification: true

  contact-confirmation:
    template-name: "contact-confirmation"
    subject:
      en: "Thank you for contacting us - {{websiteName}}"
      ar: "شكراً لك على التواصل معنا - {{websiteName}}"
    description: "Confirmation email to contact form sender"
    variables:
      - userName
      - supportEmail
      - websiteName
    features:
      - bilingual-support: true

  listing-approved:
    template-name: "listing-approved"
    subject:
      en: "Your Car Listing Has Been Approved - {{websiteName}}"
      ar: "تمت الموافقة على إعلان سيارتك - {{websiteName}}"
    description: "Notification when a car listing is approved"
    variables:
      - userName
      - listingTitle
      - listingUrl
      - websiteName
    features:
      - bilingual-support: true
      - listing-details: true

  listing-expired:
    template-name: "listing-expired"
    subject:
      en: "Your Car Listing Has Expired - {{websiteName}}"
      ar: "انتهت صلاحية إعلان سيارتك - {{websiteName}}"
    description: "Notification when a car listing expires"
    variables:
      - userName
      - listingTitle
      - renewalUrl
      - websiteName
    features:
      - bilingual-support: true
      - renewal-reminder: true

  listing-renewal:
    template-name: "listing-renewal"
    subject:
      en: "Renew Your Car Listing - {{websiteName}}"
      ar: "جدد إعلان سيارتك - {{websiteName}}"
    description: "Reminder to renew an expiring listing"
    variables:
      - userName
      - listingTitle
      - expiryDate
      - renewalUrl
      - websiteName
    features:
      - bilingual-support: true
      - urgency-notice: true

  newsletter-welcome:
    template-name: "newsletter-welcome"
    subject:
      en: "Welcome to {{websiteName}} Newsletter!"
      ar: "مرحباً بك في نشرة {{websiteName}} الإخبارية!"
    description: "Welcome email for newsletter subscribers"
    variables:
      - email
      - unsubscribeUrl
      - websiteName
    features:
      - bilingual-support: true
      - unsubscribe-link: true

# Template Settings
template-settings:
  default-language: "en"
  supported-languages:
    - en
    - ar
  branding:
    logo: "🚗"
    primary-color: "#667eea"
    secondary-color: "#764ba2"
    website-name:
      en: "Caryo"
      ar: "أوتو تريدر"
  styling:
    max-width: "600px"
    font-family: "Segoe UI, Tahoma, Geneva, Verdana, sans-serif"
    arabic-font: "Tahoma, Arial, sans-serif"
  features:
    rtl-support: true
    responsive-design: true
    dark-mode-support: false
    accessibility: true

# Email Categories
email-categories:
  user-management:
    - welcome
    - password-reset
    - password-reset-confirmation
  notifications:
    - listing-approved
    - listing-expired
    - listing-renewal
  communication:
    - contact-form
    - contact-confirmation
  marketing:
    - newsletter-welcome

# Template Management
template-management:
  version-control: true
  backup-before-update: true
  preview-mode: true
  a-b-testing: false
  analytics-tracking: true
